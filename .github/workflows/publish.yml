name: Publish Website to Hosting

on:
  push:
    branches: ["master"]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Move .htaccess
        run: mv .htaccess out/

      - name: Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: "194.36.184.54"
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          timeout: 9999
